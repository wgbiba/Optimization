<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Demands Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas for reliable Image Exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        pre, code { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .mermaid-wrapper { display: flex; justify-content: center; min-height: 400px; align-items: center; width: 100%; overflow: hidden; padding: 1rem;}
        .mermaid-wrapper svg { max-width: 100%; height: auto; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar Menu -->
    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col h-full flex-shrink-0 transition-transform duration-300 relative z-20" id="sidebar">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-700 flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                My Demands
            </h1>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-3" id="menu-container">
            <!-- Menu items injected via JS -->
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50 relative z-10">
        
        <!-- Mobile Header -->
        <div class="md:hidden p-4 bg-white border-b border-gray-200 flex items-center justify-between">
            <h1 class="text-lg font-bold text-indigo-700">My Demands</h1>
            <button onclick="toggleSidebar()" class="p-2 bg-gray-100 rounded-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>

        <!-- Dynamic Content Header -->
        <header class="p-6 md:p-8 pb-0 flex justify-between items-start">
            <div>
                <h2 id="task-title" class="text-2xl md:text-3xl font-bold text-gray-800">Loading Task...</h2>
                <p id="task-desc" class="text-gray-500 mt-2">Please wait...</p>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
                
                <!-- Flowchart Section -->
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full min-h-[500px]">
                    <div class="p-4 border-b border-gray-100 flex flex-wrap gap-4 justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="font-bold text-gray-700 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
                            Flowchart
                        </h3>
                        
                        <div class="flex items-center space-x-3">
                            <div class="relative">
                                <select id="theme-selector" onchange="changeTheme(this.value)" class="appearance-none bg-white border border-gray-300 text-gray-700 py-1.5 pl-3 pr-8 rounded-md text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <option value="modern">Modern Style</option>
                                    <option value="scientific">Scientific (B&W)</option>
                                    <option value="original">Original Colors</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                            </div>

                            <div class="flex items-center bg-white border border-gray-300 rounded-md shadow-sm">
                                <span class="text-xs text-gray-500 font-medium px-2 border-r border-gray-200 hidden sm:inline">Export</span>
                                <button onclick="downloadFlowchart('svg')" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors border-r border-gray-200" title="Download Vector">SVG</button>
                                <button onclick="downloadFlowchart('png')" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors border-r border-gray-200" title="Download Image">PNG</button>
                                <button onclick="downloadFlowchart('jpeg')" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors rounded-r-md" title="Download Image (Solid BG)">JPG</button>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 flex-grow overflow-auto relative flex justify-center bg-white rounded-b-xl" id="mermaid-export-wrapper">
                        <div id="mermaid-container" class="mermaid-wrapper">
                            <!-- Mermaid graph gets rendered here -->
                        </div>
                    </div>
                </section>

                <!-- Pseudocode Section -->
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full min-h-[500px]">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                        <h3 class="font-bold text-gray-700 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4-4-4 4M6 16l-4-4 4-4"></path></svg>
                            Pseudocode
                        </h3>
                        <div class="flex items-center bg-white border border-gray-300 rounded-md shadow-sm">
                            <span class="text-xs text-gray-500 font-medium px-2 border-r border-gray-200 hidden sm:inline">Export</span>
                            <button onclick="downloadPseudocode()" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors border-r border-gray-200" title="Download Text File">TXT</button>
                            <button onclick="downloadPseudocodeImg()" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors border-r border-gray-200" title="Download Image File">PNG</button>
                            <button onclick="copyPseudocode()" class="px-3 py-1.5 text-sm font-medium hover:bg-gray-50 text-indigo-600 transition-colors rounded-r-md" title="Copy to Clipboard">COPY</button>
                        </div>
                    </div>
                    <div class="flex-grow bg-[#1e1e1e] rounded-b-xl overflow-hidden relative" id="pseudocode-export-wrapper">
                        <pre id="pseudocode-display" class="h-full w-full m-0 p-6 overflow-auto text-sm text-gray-200 leading-relaxed"></pre>
                    </div>
                </section>

            </div>

            <!-- Explanation Section -->
            <section class="mt-8 bg-white rounded-xl shadow-sm p-6 border border-gray-200 text-sm text-gray-600">
                <h3 class="font-bold text-gray-800 mb-3 text-base flex items-center">
                    <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Main Idea & Details
                </h3>
                <div id="explanation-display" class="space-y-2 text-base leading-relaxed"></div>
            </section>
        </div>
    </main>

    <!-- Application Script (Modern ES Module) -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'base',
            securityLevel: 'loose',
            themeVariables: {
                fontFamily: 'Inter, sans-serif'
            }
        });

        let currentTaskId = 'task1'; 
        let currentTheme = 'modern';

        // Global function bindings for inline HTML handlers
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
            sidebar.classList.toggle('absolute');
        };

        const themes = {
            modern: `
classDef process fill:#e2e8f0,stroke:#64748b,stroke-width:2px,color:#0f172a,rx:8px,ry:8px;
classDef decision fill:#fef08a,stroke:#ca8a04,stroke-width:2px,color:#854d0e,rx:4px,ry:4px;
classDef terminal fill:#c7d2fe,stroke:#4f46e5,stroke-width:2px,color:#312e81,rx:30px,ry:30px;
classDef branch fill:#bfdbfe,stroke:#2563eb,stroke-width:2px,color:#1e3a8a,rx:8px,ry:8px;
            `,
            scientific: `
classDef process fill:#ffffff,stroke:#000000,stroke-width:1.5px,color:#000000,rx:0,ry:0;
classDef decision fill:#ffffff,stroke:#000000,stroke-width:1.5px,color:#000000,rx:0,ry:0;
classDef terminal fill:#ffffff,stroke:#000000,stroke-width:2px,color:#000000,rx:20px,ry:20px;
classDef branch fill:#ffffff,stroke:#000000,stroke-width:1.5px,stroke-dasharray: 5 5,color:#000000,rx:0,ry:0;
            `,
            original: `
classDef process fill:#a3e635,stroke:#4d7c0f,stroke-width:2px,color:#000000;
classDef decision fill:#facc15,stroke:#a16207,stroke-width:2px,color:#000000;
classDef terminal fill:#f87171,stroke:#b91c1c,stroke-width:2px,color:#ffffff,rx:30px,ry:30px;
classDef branch fill:#60a5fa,stroke:#1d4ed8,stroke-width:2px,color:#ffffff;
            `
        };

        const tasks = {
            // Task 3
            "task1": {
                id: "task1", group: "Task 3: Fundamentals", title: "Original Branch-and-Bound", desc: "Generic B&B Algorithm",
                flowchartCore: `
Start([Start]):::terminal --> Init["Initialization:<br/>Active Set S = {P_0}<br/>Best LB Z* = -∞"]:::process
Init --> CheckEmpty{"Is S empty?"}:::decision
CheckEmpty -->|Yes| Terminate(["Return Z* and x*"]):::terminal
CheckEmpty -->|No| Select["Node Selection"]:::process
Select --> LPRelax["LP Relaxation"]:::process
LPRelax --> Infeasible{"Is P_i infeasible?"}:::decision
Infeasible -->|Yes| CheckEmpty
Infeasible -->|No| BoundTest{"Is Z_i ≤ Z*?"}:::decision
BoundTest -->|Yes| CheckEmpty
BoundTest -->|No| IntegerCheck{"Is x_i integer?"}:::decision
IntegerCheck -->|Yes| Update["Update Z*, x*"]:::process
Update --> CheckEmpty
IntegerCheck -->|No| Branch["Branching"]:::branch
Branch --> AddSub["Add subproblems to S"]:::branch
AddSub --> CheckEmpty`,
                pseudocodeHTML: `<span class="text-indigo-400 font-bold">ALGORITHM</span> B&B_Original(P)
<span class="text-green-400">1. [Initialization]</span>
   S &larr; {P_0}; Z* &larr; -&#8734;; x* &larr; NULL
<span class="text-green-400">2. [Main Loop]</span>
   <span class="text-pink-400 font-bold">WHILE</span> S is not empty <span class="text-pink-400 font-bold">DO</span>
       Select P_i from S
       Solve LP of P_i to get Z_i and x_i
       <span class="text-pink-400 font-bold">IF</span> P_i is INFEASIBLE <span class="text-pink-400 font-bold">THEN CONTINUE</span>
       <span class="text-pink-400 font-bold">IF</span> Z_i &le; Z* <span class="text-pink-400 font-bold">THEN CONTINUE</span>
       <span class="text-pink-400 font-bold">IF</span> x_i is INTEGER <span class="text-pink-400 font-bold">THEN</span>
           Z* &larr; Z_i; x* &larr; x_i; <span class="text-pink-400 font-bold">CONTINUE</span>
       Branch on fractional var x_k and add to S
   <span class="text-pink-400 font-bold">END WHILE</span>
   <span class="text-pink-400 font-bold">RETURN</span> x*, Z*`,
                pseudocodeTXT: `ALGORITHM B&B\n1. S <- {P_0}; Z* <- -inf; x* <- NULL\n2. WHILE S is not empty DO\n   Select P_i from S; Solve LP to get Z_i, x_i\n   IF INFEASIBLE or Z_i <= Z* THEN CONTINUE\n   IF x_i is INTEGER THEN Z* <- Z_i; x* <- x_i; CONTINUE\n   Branch and add to S\n   END WHILE\nRETURN x*, Z*`,
                explanation: `Generic Branch and Bound approach for exact integer programming solutions.`
            },
            
            // Task 4
            "task2_1": {
                id: "task2_1", group: "Task 4: DP & B&B", title: "DP Knapsack", desc: "Dynamic Programming Knapsack",
                flowchartCore: `
Start([Start]):::terminal --> Init["dp[0..n][0..W]=0<br/>i=1, w=1"]:::process
Init --> TermCond{"i > n?"}:::decision
TermCond -->|Yes| End(["Return dp[n][W]"]):::terminal
TermCond -->|No| Eval{"weight[i] ≤ w?"}:::decision
Eval -->|Yes| ExpandTake["dp[i][w] = max( dp[i-1][w], dp[i-1][w-w_i] + v_i )"]:::branch
Eval -->|No| ExpandSkip["dp[i][w] = dp[i-1][w]"]:::branch
ExpandTake --> NextCap["w++"]:::process
ExpandSkip --> NextCap
NextCap --> CapCheck{"w > W?"}:::decision
CapCheck -->|No| Eval
CapCheck -->|Yes| NextItem["i++, w=1"]:::process
NextItem --> TermCond`,
                pseudocodeHTML: `<span class="text-indigo-400 font-bold">ALGORITHM</span> DPKnapsack
   Initialize dp[0..n][0..W] to 0
   <span class="text-pink-400 font-bold">FOR</span> i from 1 to n <span class="text-pink-400 font-bold">DO</span>
       <span class="text-pink-400 font-bold">FOR</span> w from 1 to W <span class="text-pink-400 font-bold">DO</span>
           <span class="text-pink-400 font-bold">IF</span> weights[i] &le; w <span class="text-pink-400 font-bold">THEN</span>
               dp[i][w] &larr; MAX(dp[i-1][w], dp[i-1][w-weights[i]] + values[i])
           <span class="text-pink-400 font-bold">ELSE</span>
               dp[i][w] &larr; dp[i-1][w]
   <span class="text-pink-400 font-bold">RETURN</span> dp[n][W]`,
                pseudocodeTXT: `ALGORITHM DPKnapsack\nInitialize dp[0..n][0..W] to 0\nFOR i from 1 to n DO\n  FOR w from 1 to W DO\n    IF weights[i] <= w THEN\n      dp[i][w] <- MAX(dp[i-1][w], dp[i-1][w-weights[i]] + values[i])\n    ELSE\n      dp[i][w] <- dp[i-1][w]\nRETURN dp[n][W]`,
                explanation: `Classic Dynamic Programming approach for the 0/1 Knapsack problem.`
            },
            "task2_2": {
                id: "task2_2", group: "Task 4: DP & B&B", title: "B&B (Strict Terminology)", desc: "Branch-and-Bound specific phrasing",
                flowchartCore: `
Start([Start]):::terminal --> Init["Initialization:<br/>Active Set S = {root node}<br/>Best LB Z* = -∞"]:::process
Init --> TermCond{"Termination condition:<br/>Is S empty?"}:::decision
TermCond -->|Yes| End(["Return Z* and optimal x*"]):::terminal
TermCond -->|No| Select["Selection of next node:<br/>Select & pop node N from S"]:::process
Select --> Eval["Bounding or evaluation step:<br/>Solve LP relaxation of N"]:::process
Eval --> CheckFeas{"Is N infeasible?"}:::decision
CheckFeas -->|Yes| TermCond
CheckFeas -->|No| CheckBound{"Z_N ≤ Z* ?"}:::decision
CheckBound -->|Yes| TermCond
CheckBound -->|No| CheckInt{"Is x_N integer?"}:::decision
CheckInt -->|Yes| Update["Update Z* = Z_N<br/>x* = x_N"]:::process
Update --> TermCond
CheckInt -->|No| Expand["State expansion or branching"]:::branch
Expand --> AddSub["Add to Set S"]:::branch
AddSub --> TermCond`,
                pseudocodeHTML: `<span class="text-indigo-400 font-bold">ALGORITHM</span> B&B_Strict(P)
<span class="text-green-400">1. [Initialization]</span>
   S &larr; {P_0}; Z* &larr; -&#8734;; x* &larr; NULL
<span class="text-green-400">2. [Termination condition]</span>
   <span class="text-pink-400 font-bold">WHILE</span> S is not empty <span class="text-pink-400 font-bold">DO</span>
       <span class="text-green-400">3. [Selection]</span>
       Select and remove N from S
       <span class="text-green-400">4. [Bounding/Evaluation]</span>
       Solve LP of N; let Z_N be upper bound
       <span class="text-pink-400 font-bold">IF</span> N is INFEASIBLE OR Z_N &le; Z* <span class="text-pink-400 font-bold">THEN CONTINUE</span>
       <span class="text-pink-400 font-bold">IF</span> x_N is INTEGER FEASIBLE <span class="text-pink-400 font-bold">THEN</span>
           Z* &larr; Z_N; x* &larr; x_N; <span class="text-pink-400 font-bold">CONTINUE</span>
       <span class="text-green-400">5. [State expansion / branching]</span>
       Branch N into N1, N2 and add to S
   <span class="text-pink-400 font-bold">END WHILE</span>
   <span class="text-pink-400 font-bold">RETURN</span> x*, Z*`,
                pseudocodeTXT: `ALGORITHM B&B_Strict(P)\n1. [Initialization]\n   S <- {P_0}; Z* <- -inf; x* <- NULL\n2. [Termination condition]\n   WHILE S is not empty DO\n       3. [Selection]\n       Select and remove N from S\n       4. [Bounding/Evaluation]\n       Solve LP of N; let Z_N be upper bound\n       IF N is INFEASIBLE OR Z_N <= Z* THEN CONTINUE\n       IF x_N is INTEGER FEASIBLE THEN\n           Z* <- Z_N; x* <- x_N; CONTINUE\n       5. [State expansion / branching]\n       Branch N into N1, N2 and add to S\n   END WHILE\n   RETURN x*, Z*`,
                explanation: `Generic B&B matching exact terminology from the assignment demands.`
            },

            // Task 5: Metaheuristics
            "task3_1": {
                id: "task3_1", group: "Task 5: Metaheuristics", title: "5.1 Simulated Annealing", desc: "Probabilistic local search",
                flowchartCore: `
Start([Start]):::terminal --> Init["Generate initial solution S<br/>Set initial Temperature T<br/>Set Cooling Rate α"]:::process
Init --> TermCond{"Is T < T_min?"}:::decision
TermCond -->|Yes| End(["Return Best S"]):::terminal
TermCond -->|No| GenNeighbor["Generate neighbor S' of S"]:::process
GenNeighbor --> CalcDelta["ΔE = f(S') - f(S)"]:::process
CalcDelta --> CheckImprove{"Is ΔE < 0 ?<br/>(Minimization)"}:::decision
CheckImprove -->|Yes| Accept["Accept: S = S'<br/>Update Best S"]:::branch
CheckImprove -->|No| CalcProb{"Random(0,1) < e^(-ΔE/T) ?"}:::decision
CalcProb -->|Yes| Accept
CalcProb -->|No| Reject["Reject S'"]:::process
Accept --> Cool["Cooling: T = α * T"]:::process
Reject --> Cool
Cool --> TermCond`,
                pseudocodeHTML: `<span class="text-indigo-400 font-bold">ALGORITHM</span> SimulatedAnnealing()
<span class="text-green-400">1. [Initialization]</span>
   S &larr; GenerateInitialSolution()
   Best_S &larr; S; T &larr; T_initial; &alpha; &larr; cooling_rate
<span class="text-green-400">2. [Main Loop]</span>
   <span class="text-pink-400 font-bold">WHILE</span> T > T_min <span class="text-pink-400 font-bold">DO</span>
       S' &larr; GenerateNeighbor(S)
       &Delta;E &larr; Objective(S') - Objective(S)
       <span class="text-pink-400 font-bold">IF</span> &Delta;E < 0 <span class="text-pink-400 font-bold">THEN</span>
           S &larr; S'
           <span class="text-pink-400 font-bold">IF</span> Objective(S) < Objective(Best_S) <span class="text-pink-400 font-bold">THEN</span> Best_S &larr; S
       <span class="text-pink-400 font-bold">ELSE IF</span> Random(0,1) < e^(-&Delta;E / T) <span class="text-pink-400 font-bold">THEN</span>
           S &larr; S'
       T &larr; &alpha; * T
   <span class="text-pink-400 font-bold">END WHILE</span>
   <span class="text-pink-400 font-bold">RETURN</span> Best_S`,
                pseudocodeTXT: `ALGORITHM SimulatedAnnealing()\n1. [Initialization]\n   S <- GenerateInitialSolution()\n   Best_S <- S; T <- T_initial; alpha <- cooling_rate\n2. [Main Loop]\n   WHILE T > T_min DO\n       S' <- GenerateNeighbor(S)\n       DeltaE <- Objective(S') - Objective(S)\n       IF DeltaE < 0 THEN\n           S <- S'\n           IF Objective(S) < Objective(Best_S) THEN Best_S <- S\n       ELSE IF Random(0,1) < e^(-DeltaE / T) THEN\n           S <- S'\n       T <- alpha * T\n   END WHILE\n   RETURN Best_S`,
                explanation: `<strong>Main Idea:</strong> Inspired by annealing in metallurgy. It allows worse solutions to be accepted with a probability that depends on a 'Temperature' parameter to escape local optima.`
            },
            "task3_2": {
                id: "task3_2", group: "Task 5: Metaheuristics", title: "5.2 Genetic Algorithms", desc: "Evolution-inspired search",
                flowchartCore: `
Start([Start]):::terminal --> Init["Initialize Population P"]:::process
Init --> Eval["Evaluate Fitness of all individuals in P"]:::process
Eval --> TermCond{"Termination Criteria Met?"}:::decision
TermCond -->|Yes| End(["Return best individual"]):::terminal
TermCond -->|No| Select["Selection:<br/>Pick parents based on fitness"]:::process
Select --> Crossover["Crossover:<br/>Recombine parents to create offspring"]:::branch
Crossover --> Mutation["Mutation:<br/>Randomly alter offspring genes"]:::branch
Mutation --> EvalNew["Evaluate Fitness of offspring"]:::process
EvalNew --> Replace["Replacement:<br/>Form new population P'"]:::process
Replace --> TermCond`,
                pseudocodeHTML: `<span class="text-indigo-400 font-bold">ALGORITHM</span> GeneticAlgorithm()
<span class="text-green-400">1. [Initialization]</span>
   P &larr; GenerateInitialPopulation(pop_size)
   EvaluateFitness(P)
<span class="text-green-400">2. [Evolution Loop]</span>
   <span class="text-pink-400 font-bold">WHILE</span> Not Terminated <span class="text-pink-400 font-bold">DO</span>
       P_new &larr; Empty Population
       <span class="text-pink-400 font-bold">WHILE</span> Size(P_new) < pop_size <span class="text-pink-400 font-bold">DO</span>
           Parent1, Parent2 &larr; SelectParents(P) 
           <span class="text-pink-400 font-bold">IF</span> Random(0,1) < crossover_rate <span class="text-pink-400 font-bold">THEN</span>
               Off1, Off2 &larr; Crossover(Parent1, Parent2)
           <span class="text-pink-400 font-bold">ELSE</span>
               Off1, Off2 &larr; Parent1, Parent2
           Mutate(Off1); Mutate(Off2)
           Add Off1, Off2 to P_new
       P &larr; P_new
       EvaluateFitness(P)
   <span class="text-pink-400 font-bold">RETURN</span> BestIndividual(P)`,

        // Render Mermaid Diagram Function (Async/Await ES Module style)
        window.renderMermaid = async function() {
            const task = tasks[currentTaskId];
            const container = document.getElementById('mermaid-container');
            
            // Show loading state briefly
            container.innerHTML = '<div class="text-gray-400 animate-pulse flex items-center p-8"><svg class="w-5 h-5 mr-2 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Rendering Graph...</div>';
            
            const fullGraphDef = `graph TD\n${themes[currentTheme]}\n${task.flowchartCore}`;

            try {
                // Generate a unique ID to circumvent caching/DOM conflict issues in Mermaid
                const uid = `graph-${currentTaskId.replace('.','_')}-${Date.now()}`;
                const { svg } = await mermaid.render(uid, fullGraphDef);
                container.innerHTML = svg;
                
                const svgNode = container.querySelector('svg');
                if(svgNode) {
                    // Force proper sizing
                    svgNode.setAttribute('width', '100%');
                    svgNode.style.maxWidth = '100%';
                    svgNode.style.height = 'auto';
                    
                    if(currentTheme === 'scientific') {
                        svgNode.style.background = '#ffffff';
                    } else {
                        svgNode.style.background = 'transparent';
                    }
                }
            } catch (error) {
                console.error("Mermaid parsing failed:", error);
                container.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-lg text-center font-semibold">Graph rendering failed due to syntax error.</div>`;
            }
        };

        window.changeTheme = function(themeValue) {
            currentTheme = themeValue;
            window.renderMermaid();
        };

        window.downloadFlowchart = function(format) {
            const svgElement = document.querySelector('#mermaid-container svg');
            if (!svgElement) return alert("Flowchart is not ready to download.");
            
            if (format === 'svg') {
                const clonedSvg = svgElement.cloneNode(true);
                const box = svgElement.getBoundingClientRect();
                const width = parseInt(clonedSvg.getAttribute('width')) || box.width || 800;
                const height = parseInt(clonedSvg.getAttribute('height')) || box.height || 600;
                
                clonedSvg.setAttribute('width', width);
                clonedSvg.setAttribute('height', height);

                const serializer = new XMLSerializer();
                let source = serializer.serializeToString(clonedSvg);
                if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
                if(!source.match(/^<svg[^>]+"http\:\/\/www\.w3\.org\/1999\/xlink"/)) source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');

                const blob = new Blob([source], { type: "image/svg+xml;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                triggerDownload(url, `flowchart-${currentTaskId}-${currentTheme}.svg`);
                URL.revokeObjectURL(url);
                return;
            }

            // Reliable rendering with html2canvas for PNG and JPEG
            const exportWrapper = document.getElementById('mermaid-export-wrapper');
            const originalBg = exportWrapper.style.backgroundColor;

            // Set solid background if necessary
            if (format === 'jpeg' || currentTheme === 'scientific') {
                exportWrapper.style.backgroundColor = '#FFFFFF';
            }

            html2canvas(exportWrapper, {
                backgroundColor: (format === 'jpeg' || currentTheme === 'scientific') ? '#FFFFFF' : null,
                scale: 2 // High res export
            }).then(canvas => {
                const imgDataUrl = canvas.toDataURL(`image/${format}`, 1.0);
                triggerDownload(imgDataUrl, `flowchart-${currentTaskId}-${currentTheme}.${format === 'jpeg' ? 'jpg' : 'png'}`);
                exportWrapper.style.backgroundColor = originalBg; // Restore background
            }).catch(err => {
                console.error("Error generating image:", err);
                alert("Failed to generate image.");
                exportWrapper.style.backgroundColor = originalBg;
            });
        };

        function triggerDownload(url, filename) {
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.downloadPseudocode = function() {
            const code = tasks[currentTaskId].pseudocodeTXT;
            const blob = new Blob([code], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, `pseudocode-${currentTaskId}.txt`);
            URL.revokeObjectURL(url);
        };

        // NEW: Function to download pseudocode as an image via html2canvas
        window.downloadPseudocodeImg = function() {
            const codeWrapper = document.getElementById('pseudocode-export-wrapper');
            
            html2canvas(codeWrapper, {
                backgroundColor: '#1e1e1e', // Ensure the dark theme matches
                scale: 2 // High res export
            }).then(canvas => {
                const imgDataUrl = canvas.toDataURL('image/png', 1.0);
                triggerDownload(imgDataUrl, `pseudocode-${currentTaskId}.png`);
            }).catch(err => {
                console.error("Error generating pseudocode image:", err);
                alert("Failed to generate image.");
            });
        };

        window.copyPseudocode = function() {
            const code = tasks[currentTaskId].pseudocodeTXT;
            // Attempt clipboard API first, fallback to execCommand for iframe limits
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => alert('Pseudocode copied to clipboard!'));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                textArea.style.position = "absolute";
                textArea.style.left = "-999999px";
                document.body.prepend(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('Pseudocode copied to clipboard!');
                } catch (error) {
                    alert('Failed to copy text.');
                } finally {
                    textArea.remove();
                }
            }
        };

        window.loadTask = function(taskId) {
            currentTaskId = taskId;
            const task = tasks[taskId];

            document.getElementById('task-title').innerText = task.title;
            document.getElementById('task-desc').innerText = task.desc;
            document.getElementById('pseudocode-display').innerHTML = task.pseudocodeHTML;
            document.getElementById('explanation-display').innerHTML = task.explanation;

            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-500');
                el.classList.add('text-gray-600', 'hover:bg-gray-50', 'border-transparent');
            });
            const activeMenu = document.getElementById(`menu-${taskId}`);
            if(activeMenu) {
                activeMenu.classList.remove('text-gray-600', 'hover:bg-gray-50', 'border-transparent');
                activeMenu.classList.add('bg-indigo-50', 'text-indigo-700', 'border-indigo-500');
            }
            window.renderMermaid();
        };

        function initMenu() {
            const menuContainer = document.getElementById('menu-container');
            const groups = {};

            Object.values(tasks).forEach(task => {
                if (!groups[task.group]) groups[task.group] = [];
                groups[task.group].push(task);
            });

            Object.keys(groups).forEach(groupName => {
                const header = document.createElement('div');
                header.className = 'text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 mt-4 px-4';
                header.innerText = groupName;
                menuContainer.appendChild(header);

                groups[groupName].forEach(task => {
                    const button = document.createElement('button');
                    button.id = `menu-${task.id}`;
                    button.className = `menu-item w-full text-left px-4 py-3 rounded-lg border-l-4 font-medium transition-colors mb-1 shadow-sm text-gray-600 border-transparent hover:bg-gray-50`;
                    button.innerHTML = `
                        <div class="truncate text-sm">${task.title}</div>
                        <div class="text-xs font-normal opacity-70 truncate mt-0.5">${task.desc}</div>
                    `;
                    button.onclick = () => {
                        window.loadTask(task.id);
                        if(window.innerWidth < 768) window.toggleSidebar();
                    };
                    menuContainer.appendChild(button);
                });
            });
        }

        // Boot the app
        document.addEventListener('DOMContentLoaded', () => {
            initMenu();
            window.loadTask('task1'); // Start on Task 1
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full', 'absolute');
            }
        });
    </script>
